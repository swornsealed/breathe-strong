.top{display:flex;align-items:center;justify-content:space-between;min-height:44px}

.fig{position:relative;height:220px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.art{width:100%;height:240px;background:#1F2125;border-radius:20px;display:block}

summary{list-style:none}summary::-webkit-details-marker{display:none}summary::after{content:' +';color:var(--acc)}details[open] summary::after{content:' −'}
textarea{width:100%;min-height:200px;font:14px/1.5 ui-monospace,Menlo,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--edge);border-radius:10px;padding:10px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#17181B;padding:10px 16px;border-radius:20px;font-weight:600;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

async function flush(){if(!dbRef||writing||!dirty)return;writing=true;dirty=false;
 try{const body={s:JSON.stringify(S),at:S.at};if(FB)await FB.F.setDoc(dbRef,body);else await dbRef.set(body);mode='account'}
 catch(e){const c=e&&e.code;if(FB||c==='unavailable'||c==='resource_exhausted'){dirty=true;setTimeout(flush,3000+Math.random()*3000)}else{dbRef=null}}
 writing=false;if(dirty&&dbRef)flush()}
function adopt(d){if(d&&typeof d.s==='string'){const r=JSON.parse(d.s);if(!S.at||(r.at||0)>=S.at){S=Object.assign(blank(),r);try{localStorage.setItem(LKEY,d.s)}catch(e){}}else{dirty=true;flush()}}}

  const[A,Au,F]=await Promise.all([import(b+'firebase-app.js'),import(b+'firebase-auth.js'),import(b+'firebase-firestore.js')]);
  const app=A.initializeApp(FBC),auth=Au.getAuth(app);FB={auth,Au,F,db:F.getFirestore(app)};
  Au.getRedirectResult(auth).catch(()=>{});

   try{const snap=await F.getDoc(dbRef);if(snap.exists())adopt(snap.data());else if(S.profile){dirty=true;flush()}mode='account'}catch(e){toast('Can’t reach the server. Saving on this phone for now.')}
   render()})}catch(e){FBERR='Sign-in couldn’t load. Check your internet connection and refresh.';render()}})()}

function dayPlan(s){const w=weekOf(s),p=phaseOf(Math.max(1,w)),wd=(pd(s).getDay()+6)%7,L=w%2?['A','B','A']:['B','A','B'];
 const m=[{k:'w',x:L[0]},{k:'z2'},{k:'w',x:L[1]},{k:p==='F'?'z2':'int'},{k:'w',x:L[2]},{k:'z2long'},{k:'rest'}][wd];return{w,p,wd,m}}
function info(m,p){if(m.k==='w')return{t:WK[m.x].t,s:WK[m.x].ex.length+' exercises · '+(S.profile&&S.profile.equip&&S.profile.equip!=='gym'?parseInt(PH[p].lift)+' × 8–15':PH[p].lift),min:50,day:'Workout '+m.x+' day'};
 if(m.k==='z2')return{t:'Zone 2 cardio',s:'Talking pace, nose breathing only',min:p==='F'&&S.profile&&pers().walk==='no'?20:PH[p].z2,day:'Zone 2 day'};
 if(m.k==='z2long')return{t:'Zone 2 or loaded carry walk',s:'Long walk with a weighted pack, nose breathing',min:45,day:'Long walk day'};
 if(m.k==='int')return{t:'Intervals + breath-hold walk',s:pick(p,[6,6,8])+' × 30 s hard / 90 s easy, then '+pick(p,[5,5,8])+' holds',min:30,day:'Intervals day'};
 return{t:'Rest + mobility',s:'Foam roller, wall angels, daily routine',min:15,day:'Rest day'}}
function scored(){const src=(S.profile&&S.profile.scoreSrc)||'snorelab';return Object.keys(S.nights).sort().filter(k=>num(S.nights[k].snore)!=null&&(S.nights[k].src||'snorelab')===src)}
function stats(){const ks=scored(),t=TODAY(),pre=ks.filter(k=>k<S.profile.start),first=(pre.length>=3?pre.slice(-14):ks.slice(0,14)).map(k=>S.nights[k].snore),base=med(first);
 const last=med(ks.filter(k=>k>=addD(t,-7)).map(k=>S.nights[k].snore));
 return{n:ks.length,base,prov:first.length<10,last,change:base&&last!=null?(base-last)/base:null}}
function weekly(){const g={};scored().forEach(k=>{const w=Math.max(0,weekOf(k));(g[w]=g[w]||[]).push(S.nights[k].snore)});
 return Object.keys(g).map(Number).sort((a,b)=>a-b).map(w=>({w,label:w?'Wk '+w:'Base',v:med(g[w])}))}

 if(a==='imtans'){S.imtEasy=v==='1'?S.imtEasy+1:0;dn(t).imt=true;I=null;save();toast(S.imtEasy>=2?'Time to raise your level':'IMT saved');go('today');return}
 if(a==='lvl'){S.imtLevel=Math.min(12,Math.max(1,S.imtLevel+(+v)));if(+v>0)S.imtEasy=0;save();render();return}
 if(a==='tag'){b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')==='true'?'false':'true');return}
 if(a==='savenight'){const d=$('#ld').value||addD(t,-1),c=$('#cpap');const ns=document.querySelector('[name=nsrc]:checked');S.nights[d]={src:ns?ns.value:(S.profile.scoreSrc||'snorelab'),snore:num($('#snore').value),partner:$('#partner').dataset.touched||S.nights[d]&&S.nights[d].partner!=null?num($('#partner').value):null,tired:$('#tired').dataset.touched||S.nights[d]&&S.nights[d].tired!=null?num($('#tired').value):null,cpapH:$('#cph')?num($('#cph').value):null,ahi:$('#cpa')?num($('#cpa').value):null,seal:$('#cps')?($('#cps').value||null):null,offs:$('#cpo')?num($('#cpo').value):null,hr:num($('#hr').value),br:num($('#br').value),ox:$('#ox')?num($('#ox').value):null,bd:$('#bd')?($('#bd').value||null):null,drinks:num($('#dr').value),tags:[...document.querySelectorAll('[data-act=tag][aria-pressed=true]')].map(x=>x.dataset.v),cpap:c?c.checked:null};save();toast('Night saved');V.date=null;go('today');return}
 if(a==='saveweek'){const w='w'+Math.max(0,weekOf(t)),ah=$('#ahi');S.weekly[w]={bolt:num($('#bolt').value),neck:num($('#neck').value),ahi:ah?num(ah.value):null,imt:S.imtLevel};save();toast('Weekly check saved');return}
 if(a==='csv'){copy(csv());return}
 if(a==='copysum'){copy($('#copytext').value);return}
});
document.addEventListener('input',e=>{const el=e.target;
 if(el.dataset.set&&W){const[i,j,f]=el.dataset.set.split(':');W.ex[+i].sets[+j][f]=el.value}
 if(el.dataset.step!=null&&N){N.steps[+el.dataset.step]=el.value}
 if(el.dataset.out){el.dataset.touched='1';const o=document.getElementById(el.dataset.out);if(o)o.textContent=el.value+' / 10'}});
document.addEventListener('change',e=>{const el=e.target;
 if(el.name==='path'&&!S.profile){const r=el.value==='retest',a=$('#cpapnote'),q=$('#quickq');if(a)a.hidden=!r;if(q)q.hidden=r}
 if(el.dataset.exdone!=null&&W){W.ex[+el.dataset.exdone].done=el.checked}
 if(el.id==='ld'){V.date=el.value;render()}});
render();
}
</script>
